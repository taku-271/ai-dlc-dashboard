<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>セッションボード</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top__row">
        <h1 class="top__title">セッションボード</h1>
        <div class="top__summary" id="summary" aria-live="polite"></div>
        <div class="top__updated" id="updated">読み込み中…</div>
      </div>
      <div class="top__row top__row--filters">
        <div class="groups" id="groups" role="group" aria-label="サイドバーのグループで絞り込み"></div>
        <input class="search" id="search" type="search" placeholder="タイトル・リポジトリ・インテントで検索" aria-label="検索" />
        <label class="toggle"><input type="checkbox" id="hide-done" /> 完了を隠す</label>
      </div>
      <div class="banner" id="banner" hidden></div>
    </header>

    <main class="board" id="board"></main>

    <template id="column-template">
      <section class="column">
        <header class="column__head">
          <span class="column__icon" aria-hidden="true"></span>
          <h2 class="column__name"></h2>
          <span class="column__count"></span>
          <p class="column__hint"></p>
        </header>
        <div class="column__cards"></div>
      </section>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
