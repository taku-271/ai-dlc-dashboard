<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-DLC ダッシュボード</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <h1>AI-DLC ダッシュボード <span class="readonly">読み取り専用</span></h1>
    <div class="meta">
      <span data-testid="update-mode" class="update-mode" hidden></span>
      <span data-testid="generated-at" class="generated-at"></span>
    </div>
  </header>

  <main>
    <p data-testid="load-error" class="load-error" role="alert" hidden></p>

    <section aria-labelledby="summary-h">
      <h2 id="summary-h" class="visually-hidden">件数のサマリー</h2>
      <ul data-testid="summary" class="summary"></ul>
    </section>

    <section aria-labelledby="attention-h" class="attention">
      <h2 id="attention-h">今あなたが見るべきもの</h2>
      <ol data-testid="attention-list" class="attention-list"></ol>
      <p data-testid="attention-empty" class="empty" hidden>今、人の対応を待っている Intent はありません。</p>
    </section>

    <section aria-labelledby="cards-h">
      <h2 id="cards-h">すべての Intent</h2>
      <div data-testid="intent-cards" class="cards"></div>
      <p data-testid="cards-empty" class="empty" hidden>Intent が見つかりません。--root の指定と aidlc/spaces/*/intents/intents.json を確認してください。</p>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
